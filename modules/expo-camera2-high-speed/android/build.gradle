plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.vestibular.screeningaid.highspeed'
version = '0.1.0'

android {
  namespace "com.vestibular.screeningaid.highspeed"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  testImplementation 'junit:junit:4.13.2'
  // P3.5 framing sampler only (lightweight ~2 Hz face/eye boxes over preview
  // snapshots). Never pupil tracking, never 120fps detection.
  implementation 'com.google.mlkit:face-detection:16.1.7'
}
